version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=production-secret-key-12345
      - DATABASE_URL=postgresql://glide_user:glide_pass@db:5432/glide_db
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=True
      - MAIL_USERNAME=your-email@gmail.com
      - MAIL_PASSWORD=your-app-password
    volumes:
      - upload_data:/app/app/static/uploads
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=glide_db
      - POSTGRES_USER=glide_user
      - POSTGRES_PASSWORD=glide_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  upload_data:
