{% extends 'base.html' %}

{% block title %}{{ _('Şifremi Unuttum') }} - {{ _('Zaman & Görev Yöneticisi') }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header border-0 py-4 text-center">
                    <i class="bi bi-patch-question-fill text-primary fs-1 mb-2"></i>
                    <h3 class="fw-bold m-0 text-white">{{ _('Şifremi Unuttum') }}</h3>
                    <p class="text-secondary small m-0 mt-1">{{ _('Hesabınızın kayıtlı e-posta adresini girin.') }}</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.reset_request') }}">
                        <div class="mb-4">
                            <label for="email" class="form-label text-secondary fs-7 fw-semibold">{{ _('E-posta Adresi') }}</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-end-0 text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control border-secondary border-start-0 ps-0" id="email" name="email" placeholder="ornek@domain.com" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 mb-3">{{ _('Sıfırlama Bağlantısı Gönder') }}</button>
                        
                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="text-secondary text-decoration-none fs-7 fw-semibold"><i class="bi bi-arrow-left me-1"></i> {{ _('Giriş Sayfasına Dön') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
