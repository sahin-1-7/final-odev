databases:
  - name: glide-db
    databaseName: glide_db
    user: glide_user
    plan: free

services:
  - type: web
    name: glide-task-planner
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glide-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
